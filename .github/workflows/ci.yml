name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo test --locked
      - run: node tests/viewer.test.mjs
      - run: cargo build --locked --release
      - run: python tools/verify_data.py
      - run: python tools/smoke.py --binary target/release/drosophila
      - run: python tools/package.py --binary target/release/drosophila --name drosophila-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: drosophila-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
